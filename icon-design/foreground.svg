<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="leafGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#4C1D95" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 浮动轨迹线 -->
  <path d="M 220 790 Q 320 765 420 780" stroke="#FFFFFF" stroke-opacity="0.20"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 200 840 Q 300 815 440 830" stroke="#FFFFFF" stroke-opacity="0.12"
        stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 叶片主体 -->
  <g filter="url(#shadow)">
    <path d="
      M 512 160
      C 620 180 770 400 770 540
      C 770 680 650 810 512 850
      C 374 810 254 680 254 540
      C 254 400 404 180 512 160
      Z"
      fill="url(#leafGrad)"/>
    <path d="
      M 512 160
      C 620 180 770 400 770 540
      C 770 680 650 810 512 850
      C 490 810 620 660 610 540
      C 600 400 545 195 512 160
      Z"
      fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- ========== 羽状主叶脉（V 字形分叉） ========== -->
  <g fill="none" stroke="url(#veinGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 512 830 Q 514 550 512 180" stroke-width="4.5"/>
    <path d="M 510 730 Q 420 690 330 600" stroke-width="3"/>
    <path d="M 511 630 Q 410 580 310 510" stroke-width="2.8"/>
    <path d="M 511 530 Q 420 480 320 420" stroke-width="2.5"/>
    <path d="M 512 440 Q 440 400 370 355" stroke-width="2.2"/>
    <path d="M 512 350 Q 465 320 430 290" stroke-width="1.8"/>
    <path d="M 510 730 Q 600 690 700 600" stroke-width="3"/>
    <path d="M 511 630 Q 610 580 720 510" stroke-width="2.8"/>
    <path d="M 511 530 Q 610 480 710 420" stroke-width="2.5"/>
    <path d="M 512 440 Q 580 400 660 355" stroke-width="2.2"/>
    <path d="M 512 350 Q 560 320 600 290" stroke-width="1.8"/>
  </g>

  <!-- ========== 横向连接弦（连接左右对应叶脉终点，形成网络） ========== -->
  <g fill="none" stroke="url(#veinGrad)" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round">
    <path d="M 330 600 Q 420 585 512 590 Q 610 585 700 600"/>
    <path d="M 310 510 Q 410 498 512 505 Q 620 498 720 510"/>
    <path d="M 320 420 Q 420 408 512 415 Q 620 408 710 420"/>
    <path d="M 370 355 Q 440 345 512 350 Q 590 345 660 355"/>
  </g>

  <!-- ========== 叶脉末端节点 ========== -->
  <g fill="#6366F1">
    <circle cx="330" cy="600" r="4.5"/>
    <circle cx="700" cy="600" r="4.5"/>
    <circle cx="310" cy="510" r="4"/>
    <circle cx="720" cy="510" r="4"/>
    <circle cx="320" cy="420" r="3.5"/>
    <circle cx="710" cy="420" r="3.5"/>
    <circle cx="370" cy="355" r="3"/>
    <circle cx="660" cy="355" r="3"/>
  </g>

  <!-- ========== 白色小圆点（数据包/露珠） ========== -->
  <g fill="#FFFFFF">
    <circle cx="440" cy="588" r="2.8" fill-opacity="0.8"/>
    <circle cx="580" cy="588" r="2.8" fill-opacity="0.8"/>
    <circle cx="420" cy="503" r="2.5" fill-opacity="0.7"/>
    <circle cx="600" cy="503" r="2.5" fill-opacity="0.7"/>
    <circle cx="425" cy="413" r="2.2" fill-opacity="0.6"/>
    <circle cx="595" cy="413" r="2.2" fill-opacity="0.6"/>
  </g>
</svg>